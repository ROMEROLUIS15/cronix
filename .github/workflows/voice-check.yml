name: Voice Check (deployed voice-worker)

# Synthetic check of the deployed voice-worker audio path (scripts/check-voice.ts):
# uploads a real WebM question as the E2E fixture user and fails unless the
# worker transcribes and answers it. Catches an expired Deepgram/Groq key or a
# broken edge deploy between pushes. A failed run notifies through the usual
# GitHub Actions failure email.
on:
  schedule:
    - cron: '0 12 * * *' # daily, 08:00 America/Caracas
  workflow_run:
    workflows: ['Deploy Supabase Edge Functions']
    types: [completed]
  workflow_dispatch:

jobs:
  check:
    name: Voice worker synthetic check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Same E2E user as the `E2E Voice` job in test.yml — never run both at once.
    concurrency:
      group: e2e-voice-fixture-user
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run voice check
        run: npm run check:voice
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL:                ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD:             ${{ secrets.E2E_TEST_PASSWORD }}
